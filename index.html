<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRGU</title>

    <style>
        body {
            background: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 50px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 35px;
        }

        h2 {
            font-size: 15px;
            margin-bottom: 12px;
        }

        .tree {
            border-left: 2px solid #ccc;
            margin-left: 7px;
            padding-left: 22px;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .link::before {
            content: "├─";
            color: #999;
        }

        .link:last-child::before {
            content: "└─";
        }

        .link:hover {
            color: #1769aa;
        }

        .domain {
            color: #999;
            font-size: 12px;
        }

        footer {
            margin-top: 45px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 12px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1c1c1c;
                color: #eee;
            }

            .tree {
                border-color: #555;
            }

            .link {
                color: #ddd;
            }

            .link::before {
                color: #777;
            }

            .domain {
                color: #888;
            }

            footer {
                border-color: #444;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NRGU</h1>
    <div class="subtitle">nrgu.org</div>

    <h2>Websites</h2>

    <div class="tree" id="links"></div>

    <footer>
        2026 Casa Damsleth®
    </footer>

</div>

<script>
    // Add new websites here.

    const websites = [
        {
            name: "Image gallery",
            url: "https://gallery.nrgu.org"
        },
        {
            name: "Vote for elevråd",
            url: "https://democracy.nrgu.org"
        },
        {
            name: "Account",
            url: "https://account.nrgu.org"
        },
    ];

    const container = document.getElementById("links");

    websites.forEach(site => {
        const link = document.createElement("a");
        link.className = "link";
        link.href = site.url;
        link.textContent = site.name;

        container.appendChild(link);
    });
</script>

<!-- Sign in / account button (top right) -->
<script src="https://account.nrgu.org/widget.js"></script>

</body>
</html>
