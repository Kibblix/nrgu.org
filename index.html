
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>NRGU — Home</title>

    <style>
        :root {
            --bg: #101827;
            --surface: #192538;
            --surface-hover: #22334b;
            --border: #2b3b52;
            --text: #edf3fc;
            --muted: #96a6bc;
            --accent: #65a9ff;
            --accent-dark: #397ed1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Header */

        header {
            height: 76px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            background: rgba(16, 24, 39, 0.92);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--accent);
        }

        .header-right {
            color: var(--muted);
            font-size: 13px;
        }

        /* Main */

        main {
            max-width: 1120px;
            margin: auto;
            padding: 75px 25px 90px;
        }

        .hero {
            margin-bottom: 55px;
            max-width: 700px;
            animation: appear 0.7s ease;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 58px);
            line-height: 1.12;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        h1 span {
            color: var(--accent);
        }

        .hero p {
            color: var(--muted);
            font-size: 16px;
            max-width: 540px;
        }

        /* Section heading */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .section-header h2 {
            font-size: 21px;
            letter-spacing: -0.5px;
        }

        .section-header span {
            color: var(--muted);
            font-size: 13px;
        }

        /* Search */

        .search {
            margin-bottom: 24px;
        }

        .search input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .search input:focus {
            border-color: var(--accent);
        }

        .search input::placeholder {
            color: #71829a;
        }

        /* Service grid */

        .services {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
        }

        .service {
            display: flex;
            flex-direction: column;
            min-height: 205px;
            padding: 23px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            transition: 0.2s ease;
            animation: appear 0.5s ease both;
        }

        .service:hover {
            transform: translateY(-4px);
            border-color: var(--accent-dark);
            background: var(--surface-hover);
        }

        .service-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .service-icon {
            width: 43px;
            height: 43px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: #253b58;
            color: var(--accent);
            font-weight: 800;
            font-size: 17px;
        }

        .service-arrow {
            color: var(--muted);
            font-size: 20px;
            transition: 0.2s;
        }

        .service:hover .service-arrow {
            color: var(--accent);
            transform: translate(3px, -3px);
        }

        .service h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .service p {
            font-size: 13px;
            color: var(--muted);
            flex: 1;
        }

        .service-domain {
            margin-top: 17px;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.3px;
        }

        .empty {
            display: none;
            color: var(--muted);
            padding: 35px;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        /* Footer */

        footer {
            border-top: 1px solid var(--border);
            padding: 28px 8%;
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 12px;
        }

        footer a:hover {
            color: var(--accent);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 750px) {
            .services {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                padding: 0 5%;
            }

            main {
                padding-top: 55px;
            }
        }

        @media (max-width: 480px) {
            .services {
                grid-template-columns: 1fr;
            }

            footer {
                flex-direction: column;
                gap: 8px;
            }

            .header-right {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="logo">NRG<span>U</span></a>
    <div class="header-right">NRGU Digital Network</div>
</header>

<main>

    <section class="hero">
        <div class="eyebrow">NRGU DIGITAL NETWORK</div>

        <h1>
            Everything in<br>
            <span>one place.</span>
        </h1>

        <p>
            Welcome to the NRGU network. Access our digital
            platforms, communicate, participate and stay connected.
            All your services, one central hub.
        </p>
    </section>

    <section>
        <div class="section-header">
            <h2>Our platforms</h2>
            <span id="service-count"></span>
        </div>

        <div class="search">
            <input
                type="search"
                id="search"
                placeholder="Search platforms..."
                autocomplete="off"
                aria-label="Search platforms"
            >
        </div>

        <div class="services" id="services"></div>

        <div class="empty" id="empty">
            No platforms found.
        </div>
    </section>

</main>

<footer>
    <div>© <span id="year"></span> NRGU Digital Network</div>
    <a href="https://nrgu.org">nrgu.org</a>
</footer>

<script>
    /*
     * ADD NEW PLATFORMS HERE.
     *
     * name: Display name
     * description: Short explanation
     * url: Destination URL
     * icon: Short text displayed in the icon box
     */

    const platforms = [
        {
            name: "Democracy",
            description: "Create polls, vote on proposals and have your voice heard.",
            url: "https://democracy.nrgu.org",
            icon: "D"
        },
        {
            name: "Chat",
            description: "Communicate, discuss and connect with other members.",
            url: "https://chat.nrg.org",
            icon: "C"
        }
    ];

    const container = document.getElementById("services");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const count = document.getElementById("service-count");

    function renderPlatforms(query = "") {
        container.innerHTML = "";

        const filtered = platforms.filter(platform => {
            const content = (
                platform.name + " " +
                platform.description + " " +
                platform.url
            ).toLowerCase();

            return content.includes(query.toLowerCase());
        });

        count.textContent = `${filtered.length} platform${filtered.length === 1 ? "" : "s"}`;

        empty.style.display = filtered.length ? "none" : "block";

        filtered.forEach(platform => {
            const card = document.createElement("a");

            card.className = "service";
            card.href = platform.url;

            card.innerHTML = `
                <div class="service-top">
                    <div class="service-icon"></div>
                    <div class="service-arrow">↗</div>
                </div>
                <h3></h3>
                <p></p>
                <div class="service-domain"></div>
            `;

            // Insert user-configured text safely.
            card.querySelector(".service-icon").textContent = platform.icon;
            card.querySelector("h3").textContent = platform.name;
            card.querySelector("p").textContent = platform.description;
            card.querySelector(".service-domain").textContent =
                new URL(platform.url).hostname;

            container.appendChild(card);
        });
    }

    search.addEventListener("input", event => {
        renderPlatforms(event.target.value);
    });

    document.getElementById("year").textContent =
        new Date().getFullYear();

    renderPlatforms();
</script>

</body>
</html>
